name: Release

on:
  push:
    tags:
      - 'v[0-9]*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          persist-credentials: false

      - name: Validate release draft
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')"
          [[ "$RELEASE_TAG" == "v$version" ]]
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,targetCommitish > /tmp/noa-release.json
          python3 - <<'PY'
          import json, subprocess
          release = json.load(open('/tmp/noa-release.json'))
          assert release['isDraft'], 'An existing draft is required'
          revision = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          assert release['targetCommitish'] == revision, 'Draft target does not match the release tag'
          PY

      - name: Set up Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Rust and Android NDK
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.99.1 --profile minimal --target aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
          rustup default 1.99.1
          cargo install cargo-ndk --version 4.1.2 --locked
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'ndk;27.2.12479018'
          printf 'ANDROID_NDK_HOME=%s/ndk/27.2.12479018\n' "$ANDROID_HOME" >> "$GITHUB_ENV"

      - name: Build Android binaries
        run: scripts/build-android.sh

      - name: Package release
        shell: bash
        run: |
          set -euo pipefail
          scripts/package-release "${RELEASE_TAG#v}" dist/release
          cp LICENSE NOTICE dist/release/
          (cd dist/release && sha256sum --check SHA256SUMS)

      - name: Upload and publish
        shell: bash
        run: |
          set -euo pipefail
          gh release upload "$RELEASE_TAG" dist/release/* --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json url,isDraft,assets
