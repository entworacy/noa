[package]
name = "noa"
version = "1.2.1"
edition = "2024"
license = "Apache-2.0"
description = "Android-native KakaoTalk room dashboard and media sender"
build = "build.rs"

[dependencies]
actix-multipart = "0.7"
actix-web = "4"
base64 = "0.22"
bytes = "1"
futures-util = "0.3"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
infer = "0.19"
jni = "0.22"
mime = "0.3"
mime_guess = "2"
openssl = { version = "0.10", features = ["vendored"] }
prost = "0.14"
rusqlite = { version = "0.37", features = ["bundled-sqlcipher-vendored-openssl"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "time", "fs"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
actix-rt = "2"
tempfile = "3"

[profile.release]
strip = "symbols"
lto = true
codegen-units = 1
opt-level = "z"
panic = "abort"
