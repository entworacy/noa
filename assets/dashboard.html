<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>noa · KakaoTalk dashboard</title>
  <style>
    :root{--bg:#0b0e12;--panel:#11161d;--panel2:#161d26;--line:#25303d;--text:#edf2f7;--muted:#8d9aaa;--yellow:#fee500;--blue:#68a8ff;--red:#ff6b78;--green:#50d890;--radius:18px}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Inter,Pretendard,"Noto Sans KR",system-ui,sans-serif}button,input{font:inherit}button{cursor:pointer}
    body:before{content:"";position:fixed;inset:-30% 0 auto -20%;height:620px;background:radial-gradient(circle,rgba(254,229,0,.07),transparent 64%);pointer-events:none}
    .shell{display:grid;grid-template-columns:310px minmax(0,1fr);min-height:100vh;position:relative}
    aside{border-right:1px solid var(--line);background:rgba(12,16,21,.92);backdrop-filter:blur(18px);padding:25px 18px;position:sticky;top:0;height:100vh;overflow:hidden;display:flex;flex-direction:column}
    .brand{display:flex;align-items:center;gap:12px;padding:0 8px 23px}.mark{width:42px;height:42px;border-radius:14px;background:var(--yellow);color:#171717;display:grid;place-items:center;font-weight:900;font-size:20px;box-shadow:0 10px 30px rgba(254,229,0,.15)}
    .brand h1{font-size:20px;line-height:1;margin:0}.brand p{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:6px 0 0}
    .search{position:relative;margin-bottom:14px}.search input{width:100%;border:1px solid var(--line);background:var(--panel);color:var(--text);padding:12px 14px 12px 38px;border-radius:13px;outline:0}.search input:focus{border-color:#546375}.search span{position:absolute;left:14px;top:11px;color:var(--muted)}
    .side-label{display:flex;justify-content:space-between;padding:6px 8px 10px;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.12em}.room-list{overflow:auto;display:flex;flex-direction:column;gap:5px;padding-right:3px}.room-list::-webkit-scrollbar{width:4px}.room-list::-webkit-scrollbar-thumb{background:#303b48;border-radius:9px}
    .room-item{border:1px solid transparent;background:transparent;color:inherit;border-radius:14px;padding:12px;text-align:left;display:grid;grid-template-columns:42px 1fr auto;gap:10px;align-items:center}.room-item:hover{background:var(--panel)}.room-item.active{background:var(--panel2);border-color:#2c3948}.room-icon{width:42px;height:42px;border-radius:14px;background:#202a36;display:grid;place-items:center;font-weight:800;color:#b7c7da}.room-item.active .room-icon{background:var(--yellow);color:#1a1a1a}.room-name{font-size:14px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.room-type{font-size:11px;color:var(--muted);margin-top:4px}.count{font-size:11px;color:var(--muted);background:#202934;padding:4px 7px;border-radius:99px}
    .aside-status{margin-top:auto;border-top:1px solid var(--line);padding:16px 8px 0;display:flex;align-items:center;gap:9px;color:var(--muted);font-size:12px}.dot{width:8px;height:8px;border-radius:50%;background:var(--red);box-shadow:0 0 0 4px rgba(255,107,120,.08)}.dot.ok{background:var(--green);box-shadow:0 0 0 4px rgba(80,216,144,.08)}
    main{padding:34px clamp(24px,4vw,64px) 70px;max-width:1500px;width:100%;margin:auto}.topbar{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin-bottom:28px}.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}.topbar h2{font-size:clamp(25px,3vw,38px);letter-spacing:-.04em;margin:0}.topbar p{margin:9px 0 0;color:var(--muted);font-size:13px}.actions{display:flex;gap:9px}.btn{border:1px solid var(--line);background:var(--panel2);color:var(--text);padding:10px 14px;border-radius:12px;font-weight:700}.btn:hover{border-color:#435166}.btn.primary{background:var(--yellow);border-color:var(--yellow);color:#1b1b1b}.btn:disabled{opacity:.45;cursor:not-allowed}
    .summary{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:24px}.stat{background:linear-gradient(135deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:var(--radius);padding:19px}.stat-label{color:var(--muted);font-size:12px}.stat-value{font-size:24px;font-weight:850;margin-top:9px;letter-spacing:-.03em}.stat small{color:var(--muted);font-weight:500;font-size:11px;margin-left:6px}
    .grid{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(330px,.75fr);gap:16px}.card{border:1px solid var(--line);background:rgba(17,22,29,.88);border-radius:var(--radius);overflow:hidden}.card-head{padding:18px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.card-head h3{font-size:14px;margin:0}.card-head span{font-size:11px;color:var(--muted)}
    .members{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:1px;background:var(--line)}.member{appearance:none;width:100%;border:0;background:var(--panel);color:var(--text);padding:17px;display:flex;align-items:center;gap:11px;min-width:0;text-align:left;transition:background .15s,box-shadow .15s}.member:hover{background:#19212b}.member:focus-visible{position:relative;z-index:1;outline:0;box-shadow:inset 0 0 0 2px var(--yellow)}.avatar{width:40px;height:40px;border-radius:14px;background:#253141;display:grid;place-items:center;overflow:hidden;color:#c3d2e4;font-weight:800;flex:none}.avatar img{width:100%;height:100%;object-fit:cover}.member-name{font-size:13px;font-weight:750;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.member-id{color:var(--muted);font-size:10px;margin-top:4px;overflow:hidden;text-overflow:ellipsis}.mine{display:inline-block;margin-left:5px;padding:2px 5px;background:rgba(254,229,0,.14);color:var(--yellow);border-radius:5px;font-size:9px}
    .timeline{max-height:540px;overflow:auto;padding:9px 18px}.event{display:grid;grid-template-columns:10px 1fr auto;gap:12px;padding:14px 0;border-bottom:1px solid rgba(37,48,61,.7)}.event:last-child{border:0}.event-dot{width:8px;height:8px;border-radius:50%;background:var(--blue);margin-top:5px}.event.joined .event-dot{background:var(--green)}.event.left .event-dot,.event.kicked .event-dot{background:var(--red)}.event-title{font-size:12px;line-height:1.55}.event-title strong{font-weight:800}.event-meta,.event-time{color:var(--muted);font-size:10px;margin-top:4px}.event-time{white-space:nowrap;margin-top:2px}
    .empty{padding:60px 25px;text-align:center;color:var(--muted);font-size:13px}.empty b{display:block;color:var(--text);font-size:16px;margin-bottom:7px}.upload-panel{display:none;margin-bottom:16px;padding:17px 19px;border:1px dashed #465365;background:rgba(22,29,38,.75);border-radius:16px}.upload-panel.open{display:flex;gap:12px;align-items:center}.upload-panel input{min-width:0;flex:1;color:var(--muted)}.progress{font-size:12px;color:var(--muted)}
    .toast{position:fixed;right:24px;bottom:24px;background:#202a35;border:1px solid #3a4858;padding:13px 17px;border-radius:13px;box-shadow:0 18px 50px #0008;font-size:12px;transform:translateY(100px);opacity:0;transition:.25s;z-index:5}.toast.show{transform:none;opacity:1}.toast.error{border-color:#703a43;color:#ffb6bd}
    .modal[hidden]{display:none}.modal{position:fixed;inset:0;z-index:20;background:rgba(3,5,8,.76);backdrop-filter:blur(7px);display:grid;place-items:center;padding:20px}.modal-card{width:min(560px,100%);max-height:min(720px,calc(100vh - 40px));display:flex;flex-direction:column;background:var(--panel);border:1px solid #344252;border-radius:22px;box-shadow:0 30px 90px #000b;overflow:hidden}.modal-head{display:flex;align-items:center;gap:13px;padding:20px;border-bottom:1px solid var(--line)}.modal-head-copy{min-width:0;flex:1}.modal-title{font-size:17px;font-weight:850;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.modal-subtitle{color:var(--muted);font-size:11px;margin-top:5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.modal-close{width:34px;height:34px;border:1px solid var(--line);border-radius:11px;background:var(--panel2);color:var(--text);font-size:18px;line-height:1}.history-summary{display:grid;grid-template-columns:repeat(3,1fr);border-bottom:1px solid var(--line)}.history-stat{padding:14px 16px;border-right:1px solid var(--line)}.history-stat:last-child{border:0}.history-stat b{display:block;font-size:16px}.history-stat span{display:block;color:var(--muted);font-size:10px;margin-top:4px}.member-history{overflow:auto;padding:7px 20px 14px}.member-history .event{padding:15px 0}.history-kind{font-size:12px;font-weight:800}.history-detail{color:var(--muted);font-size:11px;margin-top:5px}.history-room{color:var(--muted);font-size:10px;margin-top:3px}
    @media(max-width:980px){.shell{grid-template-columns:250px 1fr}.grid{grid-template-columns:1fr}.timeline{max-height:380px}}
    @media(max-width:700px){.shell{display:block}aside{position:relative;height:auto;border-right:0;border-bottom:1px solid var(--line);padding:17px}.brand{padding-bottom:14px}.room-list{flex-direction:row;overflow:auto}.room-item{min-width:190px}.aside-status{display:none}main{padding:24px 16px 50px}.summary{grid-template-columns:1fr 1fr}.summary .stat:last-child{grid-column:1/-1}.topbar{align-items:flex-end}.topbar p{display:none}.actions .btn:first-child{display:none}.members{grid-template-columns:1fr}.upload-panel.open{align-items:stretch;flex-direction:column}.modal{padding:10px}.modal-card{max-height:calc(100vh - 20px)}.history-stat{padding:12px}}
  </style>
</head>
<body>
<div class="shell">
  <aside>
    <div class="brand"><div class="mark">n</div><div><h1>noa</h1><p>room observer</p></div></div>
    <div class="search"><span>⌕</span><input id="search" placeholder="채팅방 검색" autocomplete="off"></div>
    <div class="side-label"><span>채팅방</span><span id="room-total">0</span></div>
    <div class="room-list" id="rooms"></div>
    <div class="aside-status"><span class="dot" id="status-dot"></span><span id="status-text">연결 확인 중</span></div>
  </aside>
  <main>
    <div class="topbar">
      <div><div class="eyebrow" id="room-kind">KakaoTalk rooms</div><h2 id="room-title">대시보드</h2><p id="room-id">방을 선택하면 참여자와 변경 기록을 확인할 수 있습니다.</p></div>
      <div class="actions"><button class="btn" id="token-btn">API 키</button><button class="btn primary" id="send-btn" disabled>파일 전송</button></div>
    </div>
    <div class="upload-panel" id="upload-panel"><input type="file" id="file"><span class="progress" id="upload-state">파일을 선택하세요</span><button class="btn primary" id="upload-btn">전송</button></div>
    <section class="summary">
      <div class="stat"><div class="stat-label">현재 참여자</div><div class="stat-value" id="member-count">— <small>명</small></div></div>
      <div class="stat"><div class="stat-label">기록된 변경</div><div class="stat-value" id="event-count">— <small>건</small></div></div>
      <div class="stat"><div class="stat-label">서버 상태</div><div class="stat-value" id="server-state">확인 중</div></div>
    </section>
    <div class="grid">
      <section class="card"><div class="card-head"><h3>참여자</h3><span id="member-caption">실시간 스냅샷</span></div><div class="members" id="members"><div class="empty"><b>채팅방을 선택하세요</b>참여자 목록이 여기에 표시됩니다.</div></div></section>
      <section class="card"><div class="card-head"><h3>활동 로그</h3><span>입장 · 퇴장 · 닉네임</span></div><div class="timeline" id="events"><div class="empty"><b>아직 표시할 로그가 없습니다</b>변경 이벤트가 생기면 자동 갱신됩니다.</div></div></section>
    </div>
  </main>
</div>
<div class="modal" id="member-modal" hidden>
  <section class="modal-card" role="dialog" aria-modal="true" aria-labelledby="history-title">
    <div class="modal-head"><div class="avatar" id="history-avatar">?</div><div class="modal-head-copy"><div class="modal-title" id="history-title">참여자 기록</div><div class="modal-subtitle" id="history-subtitle"></div></div><button class="modal-close" id="history-close" type="button" aria-label="닫기">×</button></div>
    <div class="history-summary"><div class="history-stat"><b id="history-total">—</b><span>전체 기록</span></div><div class="history-stat"><b id="history-presence">—</b><span>입장 · 퇴장</span></div><div class="history-stat"><b id="history-nicknames">—</b><span>닉네임 변경</span></div></div>
    <div class="member-history" id="member-history"><div class="empty"><b>기록 조회 중</b>잠시 기다려 주세요.</div></div>
  </section>
</div>
<div class="toast" id="toast"></div>
<script>
  const state={rooms:[],selected:null,events:[],status:null,memberModal:null,token:localStorage.getItem('noaToken')||''};
  const $=id=>document.getElementById(id);
  const headers=()=>state.token?{'Authorization':`Bearer ${state.token}`}:{ };
  async function api(path,options={}){const response=await fetch(path,{...options,headers:{...headers(),...(options.headers||{})}});if(response.status===401){setToken(true);throw new Error('API 키가 필요합니다.')}const data=await response.json().catch(()=>({}));if(!response.ok)throw new Error(data.error||`HTTP ${response.status}`);return data}
  function setToken(force=false){const value=prompt('NOA_API_TOKEN을 입력하세요.',force?'':state.token);if(value===null)return;state.token=value.trim();if(state.token)localStorage.setItem('noaToken',state.token);else localStorage.removeItem('noaToken');connectEvents();loadAll()}
  function toast(message,error=false){const el=$('toast');el.textContent=message;el.className='toast show'+(error?' error':'');clearTimeout(toast.timer);toast.timer=setTimeout(()=>el.className='toast',3200)}
  function initial(name){return [...(name||'?')][0].toUpperCase()}
  function renderRooms(){const query=$('search').value.trim().toLowerCase();const host=$('rooms');host.replaceChildren();const rooms=state.rooms.filter(room=>room.name.toLowerCase().includes(query)||room.chatId.includes(query));$('room-total').textContent=rooms.length;for(const room of rooms){const button=document.createElement('button');button.className='room-item'+(state.selected===room.chatId?' active':'');button.onclick=()=>selectRoom(room.chatId);const icon=document.createElement('span');icon.className='room-icon';icon.textContent=initial(room.name);const info=document.createElement('span');const name=document.createElement('div');name.className='room-name';name.textContent=room.name;const type=document.createElement('div');type.className='room-type';type.textContent=room.roomType||'CHAT';info.append(name,type);const count=document.createElement('span');count.className='count';count.textContent=room.memberCount;button.append(icon,info,count);host.append(button)}if(!rooms.length){const empty=document.createElement('div');empty.className='empty';empty.textContent='표시할 채팅방이 없습니다.';host.append(empty)}}
  function selectRoom(id){closeMemberHistory();state.selected=id;localStorage.setItem('noaRoom',id);$('send-btn').disabled=false;$('upload-panel').classList.remove('open');renderRooms();renderSelected();loadEvents()}
  function renderSelected(){const room=state.rooms.find(item=>item.chatId===state.selected);if(!room)return;$('room-kind').textContent=(room.roomType||'CHAT')+' · KAKAOTALK';$('room-title').textContent=room.name;$('room-id').textContent='chatId '+room.chatId;$('member-count').innerHTML=`${room.memberCount} <small>명</small>`;$('member-caption').textContent=`${room.memberCount}명 · 실시간 스냅샷`;const host=$('members');host.replaceChildren();for(const member of room.members){const item=document.createElement('button');item.type='button';item.className='member';item.setAttribute('aria-label',`${member.nickname} 활동 기록 보기`);item.onclick=()=>openMemberHistory(room,member);const avatar=document.createElement('div');avatar.className='avatar';avatar.textContent=initial(member.nickname);if(member.profileImageUrl){const image=new Image();image.referrerPolicy='no-referrer';image.alt='';image.onload=()=>{avatar.replaceChildren(image)};image.src=member.profileImageUrl}const info=document.createElement('div');info.style.minWidth='0';const name=document.createElement('div');name.className='member-name';name.textContent=member.nickname;if(member.isMine){const mine=document.createElement('span');mine.className='mine';mine.textContent='나';name.append(mine)}const id=document.createElement('div');id.className='member-id';id.textContent=member.userId;info.append(name,id);item.append(avatar,info);host.append(item)}if(!room.members.length){host.innerHTML='<div class="empty"><b>참여자 정보 없음</b>DB에 활성 참여자 목록이 없습니다.</div>'}}
  const labels={joined:'입장했습니다',left:'퇴장했습니다',kicked:'내보내졌습니다',nickname_changed:'닉네임을 변경했습니다'};
  function renderEvents(){const host=$('events');host.replaceChildren();$('event-count').innerHTML=`${state.events.length} <small>건</small>`;for(const event of state.events){const item=document.createElement('article');item.className='event '+event.kind;const dot=document.createElement('span');dot.className='event-dot';const body=document.createElement('div');const title=document.createElement('div');title.className='event-title';const strong=document.createElement('strong');strong.textContent=event.nickname;title.append(strong,document.createTextNode(' 님이 '+(labels[event.kind]||event.kind)));if(event.previousNickname){const meta=document.createElement('div');meta.className='event-meta';meta.textContent=`${event.previousNickname} → ${event.nickname}`;body.append(title,meta)}else{body.append(title)}const time=document.createElement('time');time.className='event-time';time.textContent=new Date(event.occurredAt*1000).toLocaleString('ko-KR',{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'});item.append(dot,body,time);host.append(item)}if(!state.events.length){host.innerHTML='<div class="empty"><b>아직 표시할 로그가 없습니다</b>변경 이벤트가 생기면 자동 갱신됩니다.</div>'}}
  async function openMemberHistory(room,member){state.memberModal={chatId:room.chatId,userId:member.userId};$('history-title').textContent=member.nickname;$('history-subtitle').textContent=`${room.name} · userId ${member.userId}`;$('history-avatar').textContent=initial(member.nickname);$('history-total').textContent='—';$('history-presence').textContent='—';$('history-nicknames').textContent='—';$('member-history').innerHTML='<div class="empty"><b>기록 조회 중</b>잠시 기다려 주세요.</div>';$('member-modal').hidden=false;$('history-close').focus();await loadMemberHistory()}
  async function loadMemberHistory(){const target=state.memberModal;if(!target)return;try{const events=await api(`/api/events?chatId=${encodeURIComponent(target.chatId)}&userId=${encodeURIComponent(target.userId)}&limit=1000`);if(!state.memberModal||state.memberModal.chatId!==target.chatId||state.memberModal.userId!==target.userId)return;renderMemberHistory(events)}catch(error){$('member-history').innerHTML='';const empty=document.createElement('div');empty.className='empty';const title=document.createElement('b');title.textContent='기록을 불러오지 못했습니다';empty.append(title,document.createTextNode(error.message));$('member-history').append(empty)}}
  function renderMemberHistory(events){$('history-total').textContent=events.length;$('history-presence').textContent=events.filter(event=>event.kind!=='nickname_changed').length;$('history-nicknames').textContent=events.filter(event=>event.kind==='nickname_changed').length;const host=$('member-history');host.replaceChildren();for(const event of events){const item=document.createElement('article');item.className='event '+event.kind;const dot=document.createElement('span');dot.className='event-dot';const body=document.createElement('div');const kind=document.createElement('div');kind.className='history-kind';kind.textContent=labels[event.kind]||event.kind;const detail=document.createElement('div');detail.className='history-detail';detail.textContent=event.kind==='nickname_changed'?`${event.previousNickname||'알 수 없음'} → ${event.nickname}`:`당시 닉네임 · ${event.nickname}`;const room=document.createElement('div');room.className='history-room';room.textContent=event.roomName;body.append(kind,detail,room);const time=document.createElement('time');time.className='event-time';time.textContent=new Date(event.occurredAt*1000).toLocaleString('ko-KR',{year:'numeric',month:'short',day:'numeric',hour:'2-digit',minute:'2-digit',second:'2-digit'});item.append(dot,body,time);host.append(item)}if(!events.length){host.innerHTML='<div class="empty"><b>기록이 없습니다</b>이 참여자의 입장, 퇴장 또는 닉네임 변경이 기록되면 표시됩니다.</div>'}}
  function closeMemberHistory(){state.memberModal=null;$('member-modal').hidden=true}
  async function loadEvents(){if(!state.selected)return;try{state.events=await api(`/api/events?chatId=${encodeURIComponent(state.selected)}&limit=200`);renderEvents()}catch(error){toast(error.message,true)}}
  async function loadAll(){try{const [status,rooms]=await Promise.all([api('/api/status'),api('/api/rooms')]);state.status=status;state.rooms=rooms;$('status-dot').classList.toggle('ok',status.databaseAvailable);$('status-text').textContent=status.databaseAvailable?'DB 연결됨':'DB 연결 안 됨';$('server-state').textContent=status.androidAvailable?'정상':'제한 모드';const previous=state.selected||localStorage.getItem('noaRoom');if(previous&&rooms.some(room=>room.chatId===previous))state.selected=previous;else if(rooms[0])state.selected=rooms[0].chatId;$('send-btn').disabled=!state.selected||!status.androidAvailable;renderRooms();renderSelected();loadEvents()}catch(error){$('server-state').textContent='오류';$('status-text').textContent='연결 실패';toast(error.message,true)}}
  let source;function connectEvents(){if(source)source.close();const token=state.token?`?token=${encodeURIComponent(state.token)}`:'';source=new EventSource('/api/events/stream'+token);source.onmessage=message=>{const event=JSON.parse(message.data);if(event.chatId===state.selected){state.events.unshift(event);state.events=state.events.slice(0,200);renderEvents()}if(state.memberModal&&event.chatId===state.memberModal.chatId&&event.userId===state.memberModal.userId)loadMemberHistory();loadRoomsQuiet()};source.onerror=()=>setTimeout(connectEvents,3000)}
  async function loadRoomsQuiet(){try{state.rooms=await api('/api/rooms');renderRooms();renderSelected()}catch(_){}}
  async function upload(){const file=$('file').files[0];if(!file||!state.selected){toast('파일과 채팅방을 선택하세요.',true);return}const button=$('upload-btn');button.disabled=true;$('upload-state').textContent=`${(file.size/1048576).toFixed(1)} MB 전송 중`;try{const result=await api(`/send?chatId=${encodeURIComponent(state.selected)}&filename=${encodeURIComponent(file.name)}`,{method:'POST',headers:{'Content-Type':file.type||'application/octet-stream'},body:file});$('upload-state').textContent=result.file.optimized?`최적화 완료 · ${(result.file.storedBytes/1048576).toFixed(1)} MB`:'전송 요청 완료';toast(result.message)}catch(error){$('upload-state').textContent='전송 실패';toast(error.message,true)}finally{button.disabled=false}}
  $('search').oninput=renderRooms;$('token-btn').onclick=()=>setToken();$('send-btn').onclick=()=>$('upload-panel').classList.toggle('open');$('upload-btn').onclick=upload;$('file').onchange=()=>{$('upload-state').textContent=$('file').files[0]?.name||'파일을 선택하세요'};$('history-close').onclick=closeMemberHistory;$('member-modal').onclick=event=>{if(event.target===$('member-modal'))closeMemberHistory()};document.addEventListener('keydown',event=>{if(event.key==='Escape'&&!$('member-modal').hidden)closeMemberHistory()});
  loadAll();connectEvents();setInterval(loadRoomsQuiet,5000);
</script>
</body>
