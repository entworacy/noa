<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Noa LOCO</title>
<style>
:root{color-scheme:dark;background:#0b0f14;color:#e6edf3;font:14px ui-monospace,SFMono-Regular,Consolas,monospace}*{box-sizing:border-box}body{margin:0}header{position:sticky;top:0;z-index:2;display:flex;gap:10px;align-items:center;padding:12px 16px;background:#111820;border-bottom:1px solid #26313d}h1{font-size:16px;margin:0 12px 0 0}input,select,button{background:#0b0f14;color:#e6edf3;border:1px solid #344150;border-radius:6px;padding:7px 9px}input{min-width:240px}button{cursor:pointer}.count{margin-left:auto;color:#8b949e}.auth{display:none;padding:16px;background:#20171a;border-bottom:1px solid #6e3038;gap:8px;align-items:center}.auth.show{display:flex}.auth input{flex:1}.error{color:#ff7b72}main{padding:12px}.packet{border:1px solid #26313d;border-radius:8px;margin-bottom:9px;overflow:hidden}.summary{display:grid;grid-template-columns:90px 150px 90px 90px 1fr;gap:10px;padding:9px 12px;background:#111820;cursor:pointer}.send{color:#79c0ff}.receive{color:#7ee787}.muted{color:#8b949e}pre{display:none;margin:0;padding:12px;white-space:pre-wrap;word-break:break-all;background:#080c10;border-top:1px solid #26313d}.packet.open pre{display:block}@media(max-width:760px){header{flex-wrap:wrap}.count{margin-left:0}.summary{grid-template-columns:75px 1fr 70px}.summary span:nth-child(4),.summary span:nth-child(5){display:none}input{min-width:150px;flex:1}}
</style>
</head>
<body>
<header><h1>Noa LOCO</h1><select id="direction"><option value="">송수신 전체</option><option value="send">SEND</option><option value="receive">RECEIVE</option></select><input id="search" placeholder="method 또는 body 검색"><button id="pause">일시 정지</button><span class="count" id="count">0 packets</span></header>
<section class="auth" id="auth"><span class="error" id="error">API 토큰이 필요합니다</span><input id="token" type="password" autocomplete="off" placeholder="Noa API token"><button id="login">적용</button></section>
<main id="packets"></main>
<script>
const params=new URLSearchParams(location.search),root=document.getElementById('packets'),direction=document.getElementById('direction'),search=document.getElementById('search'),count=document.getElementById('count'),pause=document.getElementById('pause'),auth=document.getElementById('auth'),tokenInput=document.getElementById('token'),login=document.getElementById('login'),error=document.getElementById('error'),opened=new Set;let token=params.get('token')||sessionStorage.getItem('noaToken')||'',stopped=false,data=[];if(params.get('token')){sessionStorage.setItem('noaToken',token);history.replaceState(null,'','/loco')}const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function draw(){const q=search.value.toLowerCase(),d=direction.value,rows=data.filter(p=>(!d||p.direction===d)&&(!q||p.method.toLowerCase().includes(q)||p.body.toLowerCase().includes(q)));count.textContent=`${rows.length} / ${data.length} packets`;root.innerHTML=rows.map(p=>`<section class="packet${opened.has(p.id)?' open':''}" data-id="${p.id}"><div class="summary"><strong class="${p.direction}">${p.direction.toUpperCase()}</strong><strong>${esc(p.method)}</strong><span>#${p.packetId}</span><span>status ${p.status}</span><span class="muted">${new Date(p.capturedAt).toLocaleString()} · ${p.bodyLength} bytes</span></div><pre>${esc(p.body)}</pre></section>`).join('');root.querySelectorAll('.packet').forEach(e=>e.querySelector('.summary').onclick=()=>{const id=Number(e.dataset.id);e.classList.toggle('open');e.classList.contains('open')?opened.add(id):opened.delete(id)})}async function load(){if(stopped)return;try{const headers=token?{'Authorization':`Bearer ${token}`}:{},r=await fetch('/api/loco?limit=1000',{headers});if(r.ok){data=await r.json();auth.classList.remove('show');draw();return}error.textContent=r.status===401?'API 토큰이 필요하거나 올바르지 않습니다':`API 오류: HTTP ${r.status}`}catch(e){error.textContent=`연결 오류: ${e.message}`}auth.classList.add('show')}function applyToken(){token=tokenInput.value.trim();if(token){sessionStorage.setItem('noaToken',token);load()}}login.onclick=applyToken;tokenInput.onkeydown=e=>{if(e.key==='Enter')applyToken()};direction.onchange=draw;search.oninput=draw;pause.onclick=()=>{stopped=!stopped;pause.textContent=stopped?'계속':'일시 정지';if(!stopped)load()};load();setInterval(load,750);
</script>
</body>
</html>
